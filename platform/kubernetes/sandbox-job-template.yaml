apiVersion: batch/v1
kind: Job
metadata: {generateName: agent-sandbox-, namespace: agent-sandboxes}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata: {labels: {app.kubernetes.io/component: sandbox}}
    spec:
      runtimeClassName: runc-standard # policy controls this; agents cannot select it.
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sandbox
          image: agent-runtime-sandbox:local
          securityContext: {runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: "1", memory: 1Gi}, limits: {cpu: "1", memory: 1Gi}}
