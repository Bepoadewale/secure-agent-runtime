apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-runtime-control-plane}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-runtime-control-plane}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-runtime-control-plane}}
  template:
    metadata: {labels: {app: agent-runtime-control-plane}}
    spec:
      serviceAccountName: agent-runtime-control-plane
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: AGENT_RUNTIME_DB, value: "/tmp/runtime.db"}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5}
          volumeMounts: [{name: runtime-state, mountPath: /tmp}]
      volumes: [{name: runtime-state, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: agent-runtime-control-plane}
spec:
  selector: {app: agent-runtime-control-plane}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: agent-runtime-quota}
spec: {hard: {requests.cpu: "8", requests.memory: 16Gi, pods: "30"}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
