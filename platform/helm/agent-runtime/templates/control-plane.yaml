apiVersion: v1
kind: ServiceAccount
metadata: {name: agent-runtime-control-plane}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-runtime-control-plane}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-runtime-control-plane}}
  template:
    metadata: {labels: {app: agent-runtime-control-plane}}
    spec:
      serviceAccountName: agent-runtime-control-plane
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext: {runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: agent-runtime-quota}
spec: {hard: {requests.cpu: "8", requests.memory: 16Gi, pods: "30"}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
