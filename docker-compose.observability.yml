name: secure-agent-runtime-observability
services:
  otel-collector:
    image: otel/opentelemetry-collector:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    ports: ["16686:16686"]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.5.2
    environment: ["GF_AUTH_ANONYMOUS_ENABLED=true", "GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer"]
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3001:3000"]
    depends_on: [prometheus, jaeger]
