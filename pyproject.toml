[project]
name = "secure-agent-runtime"
version = "0.1.0"
description = "Governed ephemeral execution runtime for untrusted AI agent code"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "prometheus-client>=0.21,<1", "pydantic>=2.9,<3", "typer>=0.12,<1", "uvicorn[standard]>=0.30,<1"]
[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pip-audit>=2.8,<3", "pytest>=9.0.3,<10", "ruff>=0.8,<1"]
[project.scripts]
agentctl = "agent_runtime.cli:app"
[tool.setuptools]
package-dir = {"" = "control-plane/src"}
[tool.setuptools.packages.find]
where = ["control-plane/src"]
[tool.pytest.ini_options]
pythonpath = ["control-plane/src"]
testpaths = ["control-plane/tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
